# Sound Hub — nginx LAN config (HTTP only, port 80)
#
# setup.sh substitutes __REPO_DIR__ and installs this to
# /etc/nginx/sites-available/sound-hub.
#
# For HTTPS / internet exposure, see config/nginx.conf.example — run certbot
# and it will patch in TLS certificates automatically.

limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

server {
    listen 80 default_server;
    server_name _;

    # ── SPA (static files) ───────────────────────────────────────────────────
    root __REPO_DIR__/dist;
    index index.html;

    # All unmatched paths → SPA entry point (client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── API (FastAPI backend) ────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Rate-limit the login endpoint
    location = /api/auth/login {
        limit_req          zone=login_limit burst=3 nodelay;
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ── Audio file downloads ─────────────────────────────────────────────────
    location /audio/ {
        alias __REPO_DIR__/audio/;
    }

    location /detections_audio/ {
        alias __REPO_DIR__/detections_audio/;
    }
}
