# dnsmasq config for sound-hub infrastructure
# Deploy to /etc/dnsmasq.d/local.conf on the sound-hub VM (192.168.101.204).
#
# Prerequisites:
#   1. Give the NUC a DHCP reservation in the TP-Link admin so its IP is fixed.
#      Fill that IP in for NUC_HOST_IP below (two places).
#   2. Disable systemd-resolved's stub listener so dnsmasq can own port 53:
#        sudo tee -a /etc/systemd/resolved.conf <<< '[Resolve]
#        DNS=127.0.0.1
#        DNSStubListener=no'
#        sudo systemctl restart systemd-resolved
#   3. Install and enable dnsmasq:
#        sudo apt install dnsmasq
#        sudo systemctl enable --now dnsmasq
#   4. In TP-Link DHCP settings, set:
#        Primary DNS:   <NUC_HOST_IP>
#        Secondary DNS: 1.1.1.1

# ---------------------------------------------------------------------------
# Upstream DNS
# ---------------------------------------------------------------------------

# Don't read /etc/resolv.conf — upstream is defined explicitly here.
no-resolv

# TP-Link gateway first, public fallback second.
# Replace 192.168.101.1 with your actual TP-Link gateway IP if different.
server=192.168.101.1
server=1.1.1.1


# ---------------------------------------------------------------------------
# Safety
# ---------------------------------------------------------------------------

# Don't forward bare names (no dots) upstream.
domain-needed

# Don't forward reverse lookups for private ranges upstream.
bogus-priv

# ---------------------------------------------------------------------------
# Interfaces
# ---------------------------------------------------------------------------

# Listen on loopback and the NUC's home LAN interface only.
# Replace NUC_HOST_IP with the NUC's reserved LAN IP.
listen-address=127.0.0.1,192.168.101.204

# Don't listen on VM bridge interfaces (virbr0, docker0, etc.)
except-interface=virbr0

# ---------------------------------------------------------------------------
# Local domain
# ---------------------------------------------------------------------------

# Treat .local as purely local — never forward upstream.
local=/local/

# ---------------------------------------------------------------------------
# Static records
# ---------------------------------------------------------------------------

# Sound Hub VM
address=/sound-hub.local/192.168.101.204

# Add node reservations here as DHCP reservations are assigned in TP-Link.
# Format: address=/soundcapture-XXXXXX.local/<node-ip>
#
# address=/soundcapture-ed5de4.local/192.168.101.x
