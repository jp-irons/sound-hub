# species_config.yaml — BirdNET species filter
#
# Species listed under 'summarise' are counted only — no incident log, no WAV saved.
# Everything else gets full incident logging and WAV files saved.
#
# Add a species here when its detections become too noisy to be useful.
# Use the common name exactly as BirdNET reports it.
# Run mic_to_birdnet.py with --threshold 0.3 to discover what names BirdNET uses.

summarise:
#  - "Torresian Crow"
#  - "Rainbow Lorikeet"
#  - "Gray Butcherbird"
#  - "Pied Currawong"
#  - "Australian Magpie"
